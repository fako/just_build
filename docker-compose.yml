volumes:
  postgres:
  redis:
  n8n:
  workspaces_homes:
  workspaces_secrets:
  workspaces_ssh_authorized_keys:
  workspaces_state:


x-n8n-core: &n8n_core
  image: n8nio/n8n:2.18.5
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - n8n:/home/node/.n8n
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    # Database Configuration
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${INVOKE_N8N_DATABASE_NAME}
    - DB_POSTGRESDB_USER=${INVOKE_N8N_DATABASE_USER}
    - DB_POSTGRESDB_PASSWORD=${INVOKE_N8N_DATABASE_PASSWORD}
    # N8N Specific Settings
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    - GENERIC_TIMEZONE=Europe/Amsterdam
    - WEBHOOK_URL=http://${INVOKE_N8N_HOST}/
    - N8N_EDITOR_BASE_URL=http://${INVOKE_N8N_HOST}/
    - N8N_DIAGNOSTICS_ENABLED=false
    # No N8N_ENCRYPTION_KEY on purpose. n8n generates one on first boot and persists it in the volume
    # below, which both services share. It only encrypts credentials, and credentials are entered by
    # hand in the n8n UI and never stored by this repository, so there is nothing here for a key in
    # .env to make portable. Losing the volume means re-entering them.
    - N8N_PROTOCOL=http
    - N8N_HOST=${INVOKE_N8N_HOST}
    - N8N_SECURE_COOKIE=false
    - N8N_PROXY_HOPS=1


services:

  postgres:
    profiles: [services, control, workspaces]
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./services/postgres/scripts/:/scripts/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${INVOKE_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: [services, control, workspaces]
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5

  tika:
    profiles: [services, workspaces]
    build:
      dockerfile: "Dockerfile-tika"
      context: "./services/tika"
    volumes:
      - ./services/tika/tika-config.xml:/config/tika-config.xml
    ports:
      - "127.0.0.1:9998:9998"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9998'"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    <<: *n8n_core
    # Present under control as well as services: management reaches n8n over the compose network, so
    # a control stack without it answers every workflow call with a 502.
    profiles: [services, control, workspaces]
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n-worker:
    <<: *n8n_core
    profiles: [services, control, workspaces]
    command: worker
    # Restated in full rather than adding to the anchor: a merge key replaces the whole depends_on
    # map, so listing only n8n here would drop the health gates the anchor sets on postgres and redis.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy

  nginx:
    # Serves the service hostnames that containers hand out to the outside world. Only n8n needs one
    # today; the workspaces container runs its own nginx for workspace runtimes on port 7000.
    profiles: [services, control, workspaces]
    image: nginx:alpine
    volumes:
      - ./services/nginx/conf.d/:/etc/nginx/conf.d/
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      n8n:
        condition: service_healthy

  management:
    profiles: [control, workspaces]
    build:
      dockerfile: "Dockerfile"
      context: ./management
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./invoke.yml:/invoke.yml:ro
    environment:
      - INVOKE_MANAGEMENT_SECURITY_DEBUG=${INVOKE_MANAGEMENT_SECURITY_DEBUG}
      - INVOKE_MANAGEMENT_SECURITY_SECRET_KEY=${INVOKE_MANAGEMENT_SECURITY_SECRET_KEY}
      - INVOKE_MANAGEMENT_SECURITY_API_KEY=${INVOKE_MANAGEMENT_SECURITY_API_KEY}
      - INVOKE_MANAGEMENT_DATABASE_NAME=${INVOKE_MANAGEMENT_DATABASE_NAME}
      - INVOKE_MANAGEMENT_DATABASE_USER=${INVOKE_MANAGEMENT_DATABASE_USER}
      - INVOKE_MANAGEMENT_DATABASE_PASSWORD=${INVOKE_MANAGEMENT_DATABASE_PASSWORD}
      - INVOKE_WORKSPACES_SUPERVISOR_PASSWORD=${INVOKE_WORKSPACES_SUPERVISOR_PASSWORD}
      - INVOKE_N8N_API_KEY=${INVOKE_N8N_API_KEY}
      - INVOKE_N8N_API_PROJECT_ID=${INVOKE_N8N_API_PROJECT_ID}
    develop:
      watch:
        - action: sync
          path: ./management
          target: /management
          ignore:
            - requirements.txt
            - invoke.yml
        - action: rebuild
          path: ./management/requirements.txt
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 5s
      retries: 5

  workspaces:
    profiles: [workspaces]
    build:
      dockerfile: "Dockerfile"
      context: ./workspaces
      additional_contexts:
        opencode: ./services/opencode
    ports:
      - "127.0.0.1:7000:7000"
      - "127.0.0.1:2222:22"
      # Supervisord RPC, on loopback so management can also drive it while running on the host.
      - "127.0.0.1:9001:9001"
    volumes:
      # Workspace homes and secrets are the workspaces' own files, owned by their container users.
      # They stay in volumes rather than bind mounts so the repository never collects directories
      # the host user cannot read, and so a git clean cannot take a workspace with it.
      - workspaces_homes:/home
      - workspaces_secrets:/workspaces/secrets
      # Generated config stays bind mounted: the host CLI is what writes it, from what management
      # renders, and it is useful to be able to read it without entering the container.
      - ./workspaces/src/supervisor:/etc/supervisor/conf.d
      - ./workspaces/src/nginx:/etc/nginx/conf.d
      - workspaces_ssh_authorized_keys:/etc/ssh/authorized_keys
      - workspaces_state:/workspaces/state
    environment:
      - WORKSPACES_SUPERVISOR_PASSWORD=${INVOKE_WORKSPACES_SUPERVISOR_PASSWORD}
    networks:
      default:
        aliases:
          # The one name container-to-container traffic has to resolve. Everything identifying a
          # runtime travels in the path behind it, so this list never grows as workspaces are added.
          # A name per workspace would have to be listed here and would need a recreate each time.
          - runtimes.workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
