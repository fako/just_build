server {
    listen              80;
    listen              [::]:80;
    server_name         n8n.localhost;

    # n8n builds webhook URLs and OAuth callbacks from N8N_EDITOR_BASE_URL, which points at this
    # name on port 80. Without this server the editor hands out URLs that resolve to nothing.
    # Management does not come through here: it reaches n8n at n8n:5678 on the compose network.

    # Set once at server level so both locations below inherit them and only differ in what they log.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_redirect off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Editor sessions hold long-lived connections while a workflow runs.
    proxy_read_timeout 600s;

    # The editor polls this every ten seconds for as long as a browser tab is open, which is otherwise
    # the only thing in this log. Still proxied, because the UI uses the answer to tell you the
    # backend is down; just not written down several thousand times a day.
    location = /healthz {
        access_log off;
        proxy_pass http://n8n:5678;
    }

    location / {
        proxy_pass http://n8n:5678;
    }
}
