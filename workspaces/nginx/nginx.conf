user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 7000 default_server;
        server_name _;

        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # The entrance for container-to-container traffic, reached as runtimes.workspaces:7000. The
        # workspace and runtime travel in the path rather than in the hostname, so only that one name
        # has to resolve: a name per runtime would need a DNS record or compose alias each, while
        # anything under .localhost resolves to the *caller's* own loopback and fails confusingly.
        #
        # This rewrites the path onto the internal name the runtime's own server block answers to and
        # re-enters nginx on loopback, so static/, media/ and the upstream are the generated ones
        # rather than a second copy here that could drift. Names nothing answers to (a workspace that
        # does not exist, or a runtime that serves no HTTP, such as celery) match no server block and
        # land back on this one's 404, so unknown addresses fail closed without a rule listing them.
        location ~ ^/r/(?<ws>[a-z0-9-]+)/(?<rt>[a-z0-9-]+)(?<rest>/.*)$ {
            proxy_set_header Host ${ws}.${rt}.localhost;
            proxy_pass http://127.0.0.1:7000$rest$is_args$args;
            proxy_http_version 1.1;
            # The second hop comes from loopback, so the inner block would otherwise log 127.0.0.1 as
            # the client and see the wrong scheme.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404 'Workspace not found';
            add_header Content-Type text/plain;
        }
    }

    # Runtime configs are nested per workspace. The flat glob stays for hand-written escape hatches.
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/conf.d/*/*.conf;
}
