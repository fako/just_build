; Generated by the Just Build management API for runtime "{{ runtime.name }}".
; Edits are discarded the next time `invoke runtimes.apply` reconciles this tree.
[program:{{ runtime.program_name }}]
command={{ runtime.command }}
directory={{ runtime.home_directory }}
user={{ runtime.workspace.module }}
autostart={{ settings.autostart|yesno:"true,false" }}
autorestart={{ settings.autorestart|yesno:"true,false" }}
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile={{ runtime.log_path }}
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment={{ environment }}
