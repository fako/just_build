[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ workspace.slug }}"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.12",
    "Jinja2==3.1.6",
    "psycopg[binary,pool]==3.2.3",
    "python-dotenv==1.2.2",
    "uvicorn[standard]==0.37.0",
]

[tool.setuptools.packages.find]
include = ["{{ workspace.django_module }}*"]
