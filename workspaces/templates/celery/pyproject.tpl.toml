[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ workspace.module }}"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.12",
    "invoke==3.0.3",
    "Jinja2==3.1.6",
    "psycopg[binary,pool]==3.2.3",
    "python-dotenv==1.2.2",
    "requests==2.32.5",
    "uvicorn[standard]==0.37.0",
    "celery[redis]==5.5.3",
]

[tool.setuptools.packages.find]
include = ["{{ runtime_module }}*"]
