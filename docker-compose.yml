volumes:
  postgres:
  workspaces_homes:
  workspaces_secrets:
  workspaces_ssh_authorized_keys:
  workspaces_state:


services:

  postgres:
    profiles: [services, control, workspaces]
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./services/postgres/scripts/:/scripts/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${INVOKE_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: [services, control, workspaces]
    image: redis:6-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5

  tika:
    profiles: [services, workspaces]
    build:
      dockerfile: "Dockerfile-tika"
      context: "./services/tika"
    volumes:
      - ./services/tika/tika-config.xml:/config/tika-config.xml
    ports:
      - "127.0.0.1:9998:9998"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9998'"]
      interval: 5s
      timeout: 5s
      retries: 5

  management:
    profiles: [control, workspaces]
    build:
      dockerfile: "Dockerfile"
      context: ./management
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./invoke.yml:/invoke.yml:ro
    environment:
      - INVOKE_MANAGEMENT_SECURITY_DEBUG=${INVOKE_MANAGEMENT_SECURITY_DEBUG}
      - INVOKE_MANAGEMENT_SECURITY_SECRET_KEY=${INVOKE_MANAGEMENT_SECURITY_SECRET_KEY}
      - INVOKE_MANAGEMENT_SECURITY_API_KEY=${INVOKE_MANAGEMENT_SECURITY_API_KEY}
      - INVOKE_MANAGEMENT_DATABASE_NAME=${INVOKE_MANAGEMENT_DATABASE_NAME}
      - INVOKE_MANAGEMENT_DATABASE_USER=${INVOKE_MANAGEMENT_DATABASE_USER}
      - INVOKE_MANAGEMENT_DATABASE_PASSWORD=${INVOKE_MANAGEMENT_DATABASE_PASSWORD}
      - INVOKE_WORKSPACES_SUPERVISOR_PASSWORD=${INVOKE_WORKSPACES_SUPERVISOR_PASSWORD}
    develop:
      watch:
        - action: sync
          path: ./management
          target: /management
          ignore:
            - requirements.txt
            - invoke.yml
        - action: rebuild
          path: ./management/requirements.txt
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 5s
      retries: 5

  workspaces:
    profiles: [workspaces]
    build:
      dockerfile: "Dockerfile"
      context: ./workspaces
      additional_contexts:
        opencode: ./services/opencode
    ports:
      - "127.0.0.1:7000:7000"
      - "127.0.0.1:2222:22"
      # Supervisord RPC, on loopback so management can also drive it while running on the host.
      - "127.0.0.1:9001:9001"
    volumes:
      # Workspace homes and secrets are the workspaces' own files, owned by their container users.
      # They stay in volumes rather than bind mounts so the repository never collects directories
      # the host user cannot read, and so a git clean cannot take a workspace with it.
      - workspaces_homes:/home
      - workspaces_secrets:/workspaces/secrets
      # Generated config stays bind mounted: the host CLI is what writes it, from what management
      # renders, and it is useful to be able to read it without entering the container.
      - ./workspaces/src/supervisor:/etc/supervisor/conf.d
      - ./workspaces/src/nginx:/etc/nginx/conf.d
      - workspaces_ssh_authorized_keys:/etc/ssh/authorized_keys
      - workspaces_state:/workspaces/state
    environment:
      - WORKSPACES_SUPERVISOR_PASSWORD=${INVOKE_WORKSPACES_SUPERVISOR_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
