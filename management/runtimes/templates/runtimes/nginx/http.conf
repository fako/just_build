# Generated by the Just Build management API for runtime "{{ runtime.name }}".
# Edits are discarded the next time `invoke runtimes.apply` reconciles this tree.
upstream {{ runtime.upstream_name }} {
    server 127.0.0.1:{{ runtime.port }} fail_timeout=0;
}

server {
    listen 7000;
    server_name {{ runtime.server_names|join:" " }};

    client_max_body_size 100M;

    location /static/ {
        alias {{ runtime.home_directory }}/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias {{ runtime.home_directory }}/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://{{ runtime.upstream_name }};
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
